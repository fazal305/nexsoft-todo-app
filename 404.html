<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found | Nexsoft To-Do App</title>
  <meta name="robots" content="noindex" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
  <style>
    html, body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg, #0a0a0f);
      color: var(--text, #f2f2f2);
    }
    .nf-wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      gap: 12px;
    }
    .nf-code {
      font-size: clamp(3rem, 10vw, 6rem);
      font-weight: 800;
      margin: 0;
      line-height: 1;
      color: var(--cyan, #22d3ee);
    }
    .nf-title {
      font-size: 1.25rem;
      margin: 0;
      font-weight: 600;
    }
    .nf-message {
      max-width: 42ch;
      opacity: 0.75;
      margin: 0;
    }
    .nf-link {
      margin-top: 12px;
      color: var(--cyan, #22d3ee);
      text-decoration: none;
      font-weight: 600;
      border: 1px solid currentColor;
      padding: 0.6rem 1.2rem;
      border-radius: 999px;
    }
    .nf-link:hover {
      text-decoration: underline;
    }
  </style>
  <script type="module">
    import { init } from "./bugwatcher.js";

    const { hostname } = window.location;
    const environment = /^(localhost|127\.0\.0\.1)$/.test(hostname)
      ? "development"
      : /-git-|-(?=[a-z]*\d)[a-z0-9]{9}-[a-z0-9]+\.vercel\.app$|^deploy-preview-\d+--.+\.netlify\.app$/.test(hostname)
        ? "staging"
        : "production";

    if (environment !== "development") {
      init({
        key: "bwp_pk_3RBxreHyb7oPmwvGSGaI0Yw84e1qXIYfKi3ierns",
        endpoint: "https://bugwatcher-pings-api.onrender.com/api/v1/ping",
        environment,
        maxReports: 20,
      });
    }
  </script>
</head>
<body>
  <main class="nf-wrap">
    <p class="nf-code">404</p>
    <h1 class="nf-title">Page not found</h1>
    <p class="nf-message">The page you're looking for doesn't exist or may have moved.</p>
    <a class="nf-link" href="index.html">&larr; Back to Nexsoft To-Do App</a>
  </main>
</body>
</html>
