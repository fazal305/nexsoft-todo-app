<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nexsoft To-Do App</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- App Wrapper -->
    <div class="container py-5">

        <div class="row justify-content-center">

            <div class="col-12 col-lg-8">

                <div class="app-card">

                    <!-- Header -->
                    <div class="app-header">

                        <h1 class="app-title">
                            Nexsoft To-Do App
                        </h1>

                        <p class="app-subtitle">
                            Organize tasks, priorities, and deadlines.
                        </p>

                    </div>

                    <!-- Stats -->
                    <div class="stats-row">

                        <div class="stat-box">
                            Total:
                            <span id="total-count">0</span>
                        </div>

                        <div class="stat-box">
                            Active:
                            <span id="active-count">0</span>
                        </div>

                        <div class="stat-box">
                            Completed:
                            <span id="completed-count">0</span>
                        </div>

                    </div>

                    <!-- Task Form -->
                    <div class="task-form">

                        <input
                            type="text"
                            id="task-input"
                            class="form-control"
                            placeholder="Enter a task..."
                        >

                        <small
                            id="validation-message"
                            class="validation-message"
                        >
                        </small>

                        <div class="row g-3 mt-1">

                            <div class="col-md-4">

                                <select
                                    id="priority-select"
                                    class="form-select"
                                >
                                    <option value="medium">
                                        Medium Priority
                                    </option>

                                    <option value="low">
                                        Low Priority
                                    </option>

                                    <option value="high">
                                        High Priority
                                    </option>

                                </select>

                            </div>

                            <div class="col-md-4">

                                <input
                                    type="date"
                                    id="due-date-input"
                                    class="form-control"
                                >

                            </div>

                            <div class="col-md-4 d-grid">

                                <button
                                    id="add-btn"
                                    class="btn add-btn"
                                >
                                    Add Task
                                </button>

                            </div>

                        </div>

                    </div>

                    <!-- Filters -->
                    <div class="filters-section">

                        <div class="d-flex flex-wrap gap-2">

                            <button
                                class="btn filter-btn active-filter"
                                data-filter="all"
                            >
                                All
                            </button>

                            <button
                                class="btn filter-btn"
                                data-filter="active"
                            >
                                Active
                            </button>

                            <button
                                class="btn filter-btn"
                                data-filter="completed"
                            >
                                Completed
                            </button>

                            <button
                                class="btn filter-btn"
                                data-filter="high-priority"
                            >
                                High Priority
                            </button>

                        </div>

                    </div>

                    <!-- Search -->
                    <div class="search-section">

                        <div class="input-group">

                            <input
                                type="text"
                                id="search-input"
                                class="form-control"
                                placeholder="Search tasks..."
                            >

                            <button
                                id="clear-search-btn"
                                class="btn btn-outline-secondary"
                                type="button"
                            >
                                ✕
                            </button>

                        </div>

                    </div>

                    <!-- Sort -->
                    <div class="sort-section">

                        <select
                            id="sort-select"
                            class="form-select"
                        >
                            <option value="newest">
                                Newest First
                            </option>

                            <option value="oldest">
                                Oldest First
                            </option>

                            <option value="priority">
                                Priority (High First)
                            </option>

                            <option value="due-date">
                                Due Date
                            </option>

                        </select>

                    </div>

                    <!-- Bulk Actions -->
                    <div class="bulk-actions">

                        <button
                            id="mark-all-complete-btn"
                            class="btn bulk-btn"
                        >
                            Mark All Complete
                        </button>

                        <button
                            id="mark-all-active-btn"
                            class="btn bulk-btn"
                        >
                            Mark All Active
                        </button>

                        <button
                            id="clear-completed-btn"
                            class="btn clear-btn"
                        >
                            Clear Completed
                        </button>

                    </div>

                    <!-- Task List -->
                    <div
                        id="task-list"
                        class="task-list"
                    >
                    </div>

                    <!-- Empty State -->
                    <div
                        id="empty-state"
                        class="empty-state"
                    >
                        No tasks here. ✨
                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Bootstrap Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JS -->
    <script src="script.js"></script>

</body>
</html>
